name: Move Issue to In Progress on Branch Creation
on:
  create:

jobs:
  move_to_in_progress:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Extract Issue Number from Branch Name
        id: extract
        run: |
          ISSUE_NUM=$(echo "${{ github.event.ref }}" | grep -oE '^[0-9]+')
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Update Issue Status in Project
        if: steps.extract.outputs.issue_num != ''
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PROJECT_TOKEN }}
          user: yonatanfarhi20
          project_id: 15
          resource_type: issue
          issue_number: ${{ steps.extract.outputs.issue_num }}
          workflow_issue_status: "בתהליך בנייה"
